language: "ko-KR"

reviews:
  profile: "chill"

  request_changes_workflow: false

  high_level_summary: true
  review_status: true
  review_details: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

    base_branches:
      - ".*"

chat:
  auto_reply: true
