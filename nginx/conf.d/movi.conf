# 배포 서버(EC2)의 nginx 설정 — 실제 파일은 서버의 /etc/nginx/nginx.conf 안에 있다.
#
# 이 파일은 배포 파이프라인이 읽지 않는다. 서버 설정을 손으로 고칠 때 무엇이 왜 그렇게
# 되어 있는지 확인할 수 있도록 사본을 둔다. 서버를 고쳤다면 이 파일도 함께 고칠 것.
#
# 적용 방법:
#   sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak.$(date +%Y%m%d-%H%M%S)
#   # /etc/nginx/nginx.conf 의 server 블록을 아래 내용에 맞춰 수정
#   sudo nginx -t && sudo systemctl reload nginx
#
# CORS 를 여기에 두지 않는다. 애플리케이션(CorsProperties)이 이미 같은 헤더를 붙여
# Access-Control-Allow-Origin 이 두 번 나갔고, 브라우저는 중복된 이 헤더를 거부한다.
# 그 결과 Netlify 프론트엔드에서 API 호출이 전부 실패했다(이슈 #82).
# 허용 오리진은 CorsProperties 한 곳에서만 관리한다 — 프론트 주소가 늘어도
# 서버에 SSH 로 들어갈 일이 없다.

# WebSocket 업그레이드 중계.
#
# 실시간 음성 인식은 브라우저와 백엔드 사이를 WebSocket 으로 잇는다. nginx 는
# 기본적으로 Upgrade 헤더를 다음 홉에 넘기지 않으므로(hop-by-hop 헤더),
# 이 설정이 없으면 핸드셰이크가 일반 HTTP 요청으로 처리돼 연결이 서지 않는다.
#
# map 은 http 컨텍스트에 있어야 한다. server 블록 안에서는 쓸 수 없다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 브라우저 WebSocket 인증 토큰은 현재 query parameter 로 전달된다. 기본 combined
# 로그의 $request 는 query string 전체를 남기므로 access token 이 디스크에 기록된다.
# 요청 경로는 $uri 만 기록하고 $args/$request_uri 는 의도적으로 제외한다.
log_format movi_without_query
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time urt=$upstream_response_time';

server {
    server_name moviback.duckdns.org;

    access_log /var/log/nginx/proxy/access.log movi_without_query;
    error_log  /var/log/nginx/proxy/error.log;

    location = /ws/v1/voice/stream {
        proxy_pass http://127.0.0.1:8080;

        # 운영 proxy_params 는 일반 HTTP용 300초 timeout을 포함하므로 여기서 include
        # 하면 WebSocket 전용 값을 다시 선언할 수 없다. 필요한 전달 헤더만 명시한다.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-NginX-Proxy true;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_intercept_errors off;

        # 일반 HTTP의 300초보다 길게 두어 긴 발화·재질문 중 연결을 유지한다.
        # 음성 경로에만 적용하므로 다른 API의 타임아웃은 바뀌지 않는다.
        proxy_connect_timeout 30s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        # client_max_body_size 256M 도 proxy_params 에 있어 음성 파일 업로드가 막히지 않는다.
        include /etc/nginx/proxy_params;
        proxy_pass http://127.0.0.1:8080;
    }

    listen 443 ssl;                 # managed by Certbot
    listen [::]:443 ssl ipv6only=on;
    ssl_certificate     /etc/letsencrypt/live/moviback.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moviback.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP 로 들어온 요청은 HTTPS 로 넘긴다.
server {
    listen      80;
    listen      [::]:80;
    server_name moviback.duckdns.org;

    return 301 https://$host$request_uri;
}
